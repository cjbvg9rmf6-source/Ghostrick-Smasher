<script>
(() => {
  const stopGesture = event => {
    if(event.type==='selectstart'&&event.target.id==='resultPostText')return;
    event.preventDefault();
  };
  for (const type of ['gesturestart', 'gesturechange', 'dblclick', 'selectstart']) {
    document.addEventListener(type, stopGesture, {capture: true, passive: false});
  }
})();

function playDamageSound(){return playGameSound(damageSound,()=>beep(170,.28,'sawtooth',.08));}
function playSnowAttackSound(){return playGameSound(snowAttackSound,()=>beep(760,.15,'sine',.08));}
async function playGameSound(sound,fallback=()=>{}){
 if(muted)return;
 const buffer=await sound;
 if(muted)return;
 if(!buffer){fallback();return;}
 try{
  if(ac.state==='suspended')await ac.resume();
  if(muted)return;
  const source=ac.createBufferSource(),gain=ac.createGain();
  source.buffer=buffer;
  gain.gain.value=.45*volumeSettings.se;
  source.connect(gain);
  gain.connect(ac.destination);
  source.start();
 }catch(_){}
}
function beep(freq=600,dur=.10,wave='sine',vol=.06){if(muted||volumeSettings.se===0)return;try{ac ||= new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),gain=ac.createGain();o.type=wave;o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(45,freq*.63),ac.currentTime+dur);gain.gain.setValueAtTime(vol*volumeSettings.se,ac.currentTime);gain.gain.linearRampToValueAtTime(0,ac.currentTime+dur);o.connect(gain);gain.connect(ac.destination);o.start();o.stop(ac.currentTime+dur);}catch(_){}}
function enemiesFiltered(){return g.enemies.filter(e=>!e.dead&&!e.dying&&!e.attackRemaining&&!e.launched).sort((a,b)=>a.edge-b.edge);}
const ALUCARD_SPAWN_FRAME_TIME=.12;
const ALUCARD_SPAWN_FRAMES=5;
function spawnEnemy(type){const d=DEF[type];const size=BASE_SIZE*SIZES[type],img=assets[d.anim[0]];const width=size*(type==='stein'?318/410:type==='catgirl'?284/300:type==='marie'?213/300:(img.naturalWidth?img.naturalWidth/img.naturalHeight:1.25));const e={id:++g.spawnId,type,x:W+100+width*.52,y:G,w:width,h:size,edge:W+100,dead:false,dying:0,phase:g.spawnRand()*7,hp:d.hp||1,stagger:0,jumpClock:0,jumpPhase:0,launched:false,vx:0,vy:0,rot:0,rotV:0};if(type==='marie'){
 e.x=W*.88;e.y=-2;e.edge=e.x-e.w*.46;e.entryDropT=0;
}if(type==='alucard'){
 e.x=W-width*.55;e.edge=e.x-width*.46;e.alucardSpawnT=0;
}if(type==='lantern'){e.x=W+190+width*.52;e.spawnX=e.x;e.spawnY=150+g.spawnRand()*90;e.y=e.spawnY;e.targetY=G-(26+size*.18);e.edge=e.x-e.w*.46;}if(type==='ghoul'){e.ghoulSpawnEdge=e.x-e.w*.46;e.ghoulEmergence=0;e.y=G+e.h+4;}initYoukoMorph(e);if(type==='werewolf'){e.roarAge=0;e.roarRadius=e.w*.46;}g.enemies.push(e);g.enemyCount++;}
function spawnItem(type='snow'){if(g.ally||g.items.some(it=>it.type==='snow'&&!it.dead))return;g.items.push({type:'snow',x:W+95,y:G-98,r:26,phase:g.spawnRand()*7,dead:false});}
function confetti(x,y,colors,count=16,power=130){for(let i=0;i<count;i++){const ang=g.spawnRand()*Math.PI*2,s=(.3+g.spawnRand())*power;g.particles.push({x,y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s-32,size:3+g.spawnRand()*7,life:.4+g.spawnRand()*.58,max:1,color:colors[Math.floor(g.spawnRand()*colors.length)],shape:g.spawnRand()>.55?'diamond':'dot'});}}

// Fairy grows from 0.5x to 1.0x before reaching the attack window.
// Preserve the approaching edge while resizing, so growth cannot cause an early collision.
function updateFairyGrowth(e){
 if(e.type!=='fairy'||e.launched||e.dead)return;
 const edge=e.x-e.w*.46;
 const distance=edge-attackEdge();
 const progress=Math.max(0,Math.min(1,(220-distance)/(220-24)));
 const growth=Math.max(e.fairyGrowth||0,progress*progress*(3-2*progress));
 const ratio=e.w/e.h;
 e.fairyGrowth=growth;
 e.h=BASE_SIZE*(SIZES.fairy+(1-SIZES.fairy)*growth);
 e.w=e.h*ratio;
 e.x=edge+e.w*.46;
 e.edge=edge;
}
// Ghoul rises from below the ground, finishing just before the attack window.
function updateGhoulEmergence(e){
 if(e.type!=='ghoul'||e.launched||e.dead)return;
 const edge=e.x-e.w*.46;
 const start=e.ghoulSpawnEdge??edge;
 const finish=attackEdge()+24;
 const progress=Math.max(0,Math.min(1,(start-edge)/Math.max(1,start-finish)));
 const emergence=Math.max(e.ghoulEmergence||0,progress*progress*(3-2*progress));
 e.ghoulEmergence=emergence;
 e.y=G+(e.h+4)*(1-emergence);
}
// Doll snaps to 0.3x immediately before entering the attack window.
function updateDollShrink(e){
 if(e.type!=='doll'||e.launched||e.dead||e.dollShrunk)return;
 const edge=e.x-e.w*.46;
 if(edge>attackEdge()+24)return;
 const ratio=e.w/e.h;

 e.h=BASE_SIZE*.3;
 e.w=e.h*ratio;
 e.x=edge+e.w*.46;
 e.edge=edge;
}

function lerp(a,b,t){return a+(b-a)*t;}
// Real articulated broom animation: the broom head and shaft move, not just a visual trail.
// 4 strikes compose a closed sequence: rising diagonal, high sweep, falling diagonal, turn/recovery.
function easeSwing(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}

function attackMotion(step,p){
 let dx=0,dy=0,rot=0;
 if(step===1){dx=24+( -12-24)*p;dy=20+(-28-20)*p;rot=.95+(-.48-.95)*p;}
 else if(step===2){dx=-18+(22+18)*p;dy=-20+(-10+20)*p;rot=-.56+(.18+.56)*p;}
 else if(step===3){dx=18+(-14-18)*p;dy=-16+(24+16)*p;rot=.10+(1.02-.10)*p;}
 else {
   if(p<.58){const t=p/.58;dx=-10+(18+10)*t;dy=-8+(-14+8)*t;rot=-.14+(.34+.14)*t;}
   else {const t=(p-.58)/.42;dx=18+(8-18)*t;dy=-14+(18+14)*t;rot=.34+(1.08-.34)*t;}
 }
 return {dx,dy,rot};
}

function swingAngle(style,p){
 const q=easeSwing(p);
 // angles in the world coordinate system, 0 means straight right; clockwise is positive.
 if(style===1)return .22+(-2.32)*q;       // right-down to left-up
 if(style===2)return -2.10+1.77*q;        // left-up to right-upper arc
 if(style===3)return -.33-3.07*q;        // right-up to lower-left
 // sweep to the left and turn through the recovery into right-down guard
 return -3.40+3.62*q;                     // finishes ~.63 rad modulo 2PI
}
function drawCrescent(x,y,r,rot,alpha){
 c.save();
 c.translate(x,y);c.rotate(rot);
 c.globalAlpha=alpha;
 c.fillStyle='#fff7d8';
 c.beginPath();
 c.arc(0,0,r,0,Math.PI*2);
 c.arc(r*.42,-r*.06,r*.86,0,Math.PI*2);
 c.fill('evenodd');
 c.restore();
}

// Premium high-contrast crescent magic based on the approved effect sheet.
// The broom is part of the unchanged attack sprite; only the magic effect animates.
function starShape(x,y,r,rot=0,fill='#fff3ab'){
 c.save();c.translate(x,y);c.rotate(rot);
 c.beginPath();for(let i=0;i<10;i++){
   const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.43:r;
   const xx=Math.cos(a)*rr, yy=Math.sin(a)*rr;
   if(i===0)c.moveTo(xx,yy);else c.lineTo(xx,yy);
 }c.closePath();c.fillStyle=fill;c.fill();if(r>5){c.lineWidth=Math.max(1.5,r*.11);c.strokeStyle='#ff4fae';c.stroke();}c.restore();
}
function magicCrescentShape(cx,cy,rx,ry,a0,a1,reveal,thickness=27){
 const n=Math.max(4,Math.ceil(44*reveal));
 c.beginPath();
 for(let i=0;i<=n;i++){
  const t=reveal*i/n,a=a0+(a1-a0)*t;
  const x=cx+Math.cos(a)*rx,y=cy+Math.sin(a)*ry;
  if(i===0)c.moveTo(x,y);else c.lineTo(x,y);
 }
 for(let i=n;i>=0;i--){
  const t=reveal*i/n,a=a0+(a1-a0)*t;
  const w=thickness*Math.pow(Math.max(0,Math.sin(Math.PI*t)),.75);
  c.lineTo(cx+Math.cos(a)*(rx-w),cy+Math.sin(a)*(ry-w));
 }
 c.closePath();
}
function drawAttackTrail(step,p){
 // Match the visible slash range to the real hit range used by inAttackZone().
 const q=Math.min(1,p*2.1),fade=Math.max(0,1-Math.max(0,p-.64)/.36);
 const hitMin=CONTACT_EDGE+2,hitMax=attackEdge()-2;
 const zone=Math.max(38,hitMax-hitMin);
 const cx=(hitMin+hitMax)/2;
 const cy=G-98;
 const stretch=step===4?1.05:step===2?.98:1;
 const rx=Math.max(28,zone*.48*stretch);
 const ry=Math.max(34,rx*.74+(step===4?8:0));
 const rot=[-.18,-.33,.26,-.08][(step-1)%4];
 const angle0=-2.38+rot,angle1=1.06+rot;
 if(q<=.01)return;
 c.save();
 c.globalCompositeOperation='source-over';
 const layers=[
  {extra:10,alpha:.13,blur:26,color:'#fa75ff'},
  {extra:4,alpha:.35,blur:17,color:'#ff79ee'},
  {extra:0,alpha:.90,blur:9,color:'#f84bca'},
  {extra:-8,alpha:1,blur:4,color:'#fff4ff'}
 ];
 for(const l of layers){
  c.save();c.globalAlpha=l.alpha*fade;
  c.shadowColor='#fa4cdb';c.shadowBlur=l.blur;
  const grad=c.createLinearGradient(hitMin,cy-ry,hitMax,cy+ry);
  grad.addColorStop(0,l.color);grad.addColorStop(.55,l.color);grad.addColorStop(1,'#fff3d1');
  c.fillStyle=grad;
  magicCrescentShape(cx,cy,rx+l.extra,ry+l.extra,angle0,angle1,q,Math.max(3,22+l.extra));
  c.fill();c.restore();
 }
 // Comet streaks stay inside the actual hit window.
 for(let k=0;k<3;k++){
  const a=angle0+(angle1-angle0)*Math.max(.18,q*.56-k*.09);
  const orx=Math.max(18,rx-4+k*5),ory=Math.max(20,ry-3+k*4);
  const ox=cx+Math.cos(a)*orx,oy=cy+Math.sin(a)*ory;
  c.save();c.globalAlpha=(.22+k*.09)*fade;
  c.lineWidth=4-k*.5;c.lineCap='round';c.strokeStyle=k===0?'#ffffff':'#ff7ee3';
  c.beginPath();c.arc(ox,oy,Math.max(10,rx*.18+k*4),a-.58,a+.18);c.stroke();c.restore();
 }
 // Stars also live inside the hit zone for readability.
 const stars=[.27,.56,.84];
 for(let i=0;i<stars.length;i++){
  const u=stars[i];if(u>q+.06)continue;
  const a=angle0+(angle1-angle0)*u;
  const x=cx+Math.cos(a)*(rx-2+i%2*4),y=cy+Math.sin(a)*(ry-1);
  const grow=Math.min(1,Math.max(0,(q-u+.1)*5));
  const rr=(i===1?18:14)*grow*(.84+.16*Math.sin(g.t*32+i));
  c.save();c.globalAlpha=fade*.92;c.shadowBlur=12;c.shadowColor='#ff73bd';
  starShape(x,y,rr,g.t*1.7+i,'#ffe36a');c.restore();
  twinkle(x+rr*.7,y-rr*.9,4+rr*.24,'#fffaff');
 }
 // Sparkling tip of the slash.
 const at=angle0+(angle1-angle0)*q;
 const x=cx+Math.cos(at)*rx,y=cy+Math.sin(at)*ry;
 c.save();c.globalAlpha=fade;c.shadowBlur=16;c.shadowColor='#ffffff';
 starShape(x,y,11+5*Math.sin(Math.PI*q),g.t*4,'#fff1a2');c.restore();
 c.restore();
}

function drawMagicImpact(f){
 // Animated star impact in front of the enemy; retained briefly after the swipe.
 const age=1-f.life/.43;const grow=Math.min(1,age*5);
 const fade=Math.pow(Math.max(0,1-age),.52);
 const r=(22+age*58)*grow;
 c.save();c.translate(f.x,f.y);c.globalCompositeOperation='source-over';
 c.globalAlpha=fade;c.shadowColor='#ff6bdf';c.shadowBlur=24;
 for(let i=0;i<10;i++){
  const a=i*Math.PI/5+age*.11;
  const len=r*(i%2?.65:1.08), inner=r*.25;
  c.strokeStyle=i%2?'#ffe8fc':'#ff7ee2';c.lineWidth=i%2?5:7;c.lineCap='round';
  c.beginPath();c.moveTo(Math.cos(a)*inner,Math.sin(a)*inner);
  c.lineTo(Math.cos(a)*len,Math.sin(a)*len);c.stroke();
 }
 c.shadowBlur=18;c.shadowColor='#ffd161';
 starShape(0,0,Math.max(2,34*fade+12*grow),age*.9,'#ffe771');
 c.shadowBlur=0;c.globalAlpha=fade;
 starShape(-r*.93,-r*.31,13*(1-age*.6),-.2,'#fff7c8');
 starShape(r*.88,-r*.60,11*(1-age*.6),.2,'#ffe09e');
 c.restore();
}

 shareToX.href='https://x.com/intent/tweet?'+new URLSearchParams({text:resultPost});
 const imageUrl=document.getElementById('rankCelebrationImage').src;
 rankDownload.href=imageUrl;
 const filename=imageUrl.split('/').pop();
 rankDownload.download=filename;
 rankShareFile=null;
 resultShareStatus.textContent='画像を手動で添付する場合は「ランク画像を保存」を押してください。';
 if(navigator.canShare && navigator.share){
  fetch(imageUrl).then(response=>{
   if(!response.ok)throw new Error('Rank image unavailable');
   return response.blob();
  }).then(blob=>{
   const file=new File([blob],filename,{type:'image/png'});
   if(rankDownload.href===imageUrl && navigator.canShare({files:[file],text:resultPost})){
    rankShareFile=file;
    resultShareStatus.textContent='「Xで投稿」を押し、共有先にXを選んでください。';
   }
  }).catch(()=>{});
 }
 resultPostText.hidden=true;
}
shareToX.addEventListener('click',async event=>{
 if(!rankShareFile)return;
 event.preventDefault();
 try{
  await navigator.share({files:[rankShareFile],text:resultPost});
 }catch(error){
  if(error.name==='AbortError')return;
  rankShareFile=null;
  resultShareStatus.textContent='「ランク画像を保存」を押してから「Xで投稿」を開き、画像を添付してください。';
 }
});
document.getElementById('copyResult').addEventListener('click',async()=>{
 try{
  await navigator.clipboard.writeText(resultPost);
  resultShareStatus.textContent='投稿文をコピーしました。';
 }catch(_){
  resultPostText.value=resultPost;
  resultPostText.hidden=false;
  resultPostText.focus();
  resultPostText.select();
  resultShareStatus.textContent='投稿文を選択しました。端末のコピー操作でコピーできます。';
 }
});
const optionsPanel=document.getElementById('optionsPanel');
const catalogPanel=document.getElementById('catalogPanel');
const catalogList=document.getElementById('catalogList');
const catalogDetail=document.getElementById('catalogDetail');
const catalogCount=document.getElementById('catalogCount');
const catalogImage=document.getElementById('catalogImage');
function showMenu(panel=null,focus=null){
 titleContent.hidden=panel!==null;
 optionsPanel.hidden=panel!==optionsPanel;
 catalogPanel.hidden=panel!==catalogPanel;
 if(focus)focus.focus();
}
const catalogOrder=CATALOG_GROUPS.flat();
const catalogPrev=document.getElementById('catalogPrev');
const catalogNext=document.getElementById('catalogNext');
let catalogIndex=0;

function openCatalog(){
 catalogList.hidden=false;
 catalogDetail.hidden=true;
 catalogCount.hidden=false;
 catalogCount.textContent=`${discoveredGhostricks.size} / ${catalogOrder.length} 種`;
 catalogList.replaceChildren();
 let index=0;
 for(const group of CATALOG_GROUPS){
  const row=document.createElement('div');
  row.className='catalog-group';
  for(const id of group){
   const entryIndex=index++;
   const button=document.createElement('button');
   button.type='button';
   button.className='pill';
   const unlocked=discoveredGhostricks.has(id);
   button.textContent=unlocked?CATALOG_ENTRIES[id].label:'？？？';
   button.classList.toggle('catalog-locked',!unlocked);
   button.setAttribute('aria-label',`No. ${entryIndex+1} ${unlocked?CATALOG_ENTRIES[id].label:'未遭遇'}`);
   button.addEventListener('click',()=>{
    openCatalogEntry(entryIndex);
    document.getElementById('catalogBack').focus();
   });
   row.append(button);
  }
  catalogList.append(row);
 }
 showMenu(catalogPanel,document.getElementById('catalogClose'));
}
function catalogEncounterDistance(id){
 if(id==='snow')return '約54m〜';
 const distance=id==='witch'?0:ENEMY_UNLOCKS.find(enemy=>enemy.type===id).distance;
 return distance.toLocaleString('ja-JP')+'m〜';
}
function renderCatalogLife(id,unlocked){
 const catalogLife=document.getElementById('catalogLife');
 const life=unlocked?(id==='witch'?WITCH_MAX_LIFE:DEF[id]?.hp):0;
 catalogLife.hidden=!life;
 catalogLife.replaceChildren();
 if(!life)return;
 catalogLife.setAttribute('aria-label',`ライフ ${life}`);
 for(let i=0;i<life;i++){
  const heart=document.createElement('span');
  heart.className='catalog-heart';
  heart.setAttribute('aria-hidden','true');
  if(id==='fallen'){
   heart.append(document.getElementById('catalogStitchedHeart').content.cloneNode(true));
  }else{
   heart.textContent='♥';
  }
  catalogLife.append(heart);
 }
}
function openCatalogEntry(index){
 const id=catalogOrder[index];
 if(!id)return;
 catalogIndex=index;
 const entry=CATALOG_ENTRIES[id];
 const unlocked=discoveredGhostricks.has(id);
 catalogList.hidden=true;
 catalogDetail.hidden=false;
 catalogCount.hidden=true;
 catalogPrev.disabled=index===0;
 catalogNext.disabled=index===catalogOrder.length-1;
 document.getElementById('catalogPage').textContent=`${index+1} / ${catalogOrder.length}`;
 document.getElementById('catalogName').textContent=unlocked?entry.label:'？？？';
 renderCatalogLife(id,unlocked);
 document.getElementById('catalogEncounter').textContent='出現条件: '+catalogEncounterDistance(id);
 document.getElementById('catalogDescription').textContent=unlocked?entry.description:'ゲーム中に遭遇すると情報が解放されます。';
 document.getElementById('catalogLinks').hidden=!unlocked||!(entry.wiki||entry.official||entry.pixiv);
 const pixiv=document.getElementById('catalogPixiv');
 pixiv.hidden=!unlocked||!entry.pixiv;
 if(!pixiv.hidden)pixiv.href=entry.pixiv;
 else pixiv.removeAttribute('href');
 catalogImage.hidden=!unlocked;
 if(!unlocked){
  catalogImage.removeAttribute('src');
  catalogImage.alt='';
  return;
 }
 const wiki=document.getElementById('catalogWiki');
 wiki.hidden=!entry.wiki;
 if(entry.wiki)wiki.href=entry.wiki;
 else wiki.removeAttribute('href');
 const official=document.getElementById('catalogOfficial');
 official.hidden=!entry.official;
 if(entry.official)official.href=entry.official;
 else official.removeAttribute('href');
 official.textContent=entry.direct?'公式カードデータベース ↗':'公式カード紹介（新規収録） ↗';
 catalogImage.alt=entry.label+(entry.portrait?'の図鑑イラスト':'のゲーム内画像');
 catalogImage.classList.toggle('catalog-flipped',!entry.portrait&&(entry.flip??enemyShouldFlip(id)));
 catalogImage.classList.toggle('catalog-ghoul-portrait',id==='ghoul'&&!!entry.portrait);
 const portraitStage=catalogImage.parentElement;
 portraitStage.classList.toggle('catalog-portrait-stage',!!entry.portrait);
 portraitStage.style.setProperty('--portrait-ratio',id==='ghoul'?'1312 / 1168':'1');
 catalogImage.src=entry.portrait??SPRITE_SOURCES[entry.sprite];
}
catalogPrev.addEventListener('click',()=>openCatalogEntry(catalogIndex-1));
catalogNext.addEventListener('click',()=>openCatalogEntry(catalogIndex+1));

const orientationQuery=window.matchMedia('(orientation:portrait) and (max-width:800px) and (pointer:coarse)');
const orientationButtons=document.querySelectorAll('.orientation-toggle');
let manualLandscape=false;
function syncOrientation(){
 if(!orientationQuery.matches)manualLandscape=false;
 document.body.classList.toggle('force-landscape',manualLandscape);
 for(const button of orientationButtons){
  button.textContent=manualLandscape?'縦画面に戻す':'横画面にする';
  button.setAttribute('aria-pressed',String(manualLandscape));
 }
}
for(const button of orientationButtons){
 button.addEventListener('click',()=>{
  if(!orientationQuery.matches)return;
  manualLandscape=!manualLandscape;
  syncOrientation();
 });
}
if(orientationQuery.addEventListener)orientationQuery.addEventListener('change',syncOrientation);
else orientationQuery.addListener(syncOrientation);
syncOrientation();

let swipeStart=null;
catalogDetail.addEventListener('touchstart',event=>{
 const touch=event.touches.length===1?event.touches[0]:null;
 swipeStart=touch?{x:touch.clientX,y:touch.clientY}:null;
},{passive:true});
catalogDetail.addEventListener('touchcancel',()=>{swipeStart=null;});
catalogDetail.addEventListener('touchend',event=>{
 if(!swipeStart)return;
 const touch=event.changedTouches[0];
 const screenDx=touch.clientX-swipeStart.x;
 const screenDy=touch.clientY-swipeStart.y;
 const dx=manualLandscape?screenDy:screenDx;
 const dy=manualLandscape?-screenDx:screenDy;
 swipeStart=null;
 if(Math.abs(dx)>=45&&Math.abs(dx)>Math.abs(dy)*1.5){
  openCatalogEntry(catalogIndex+(dx<0?1:-1));
 }
},{passive:true});
